name: Update ZeroOmega Lists

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать текущий репозиторий
        uses: actions/checkout@v4

      - name: Скачать базу доменов v2fly
        uses: actions/checkout@v4
        with:
          repository: v2fly/domain-list-community
          path: v2fly-data
          sparse-checkout: |
            data

      - name: Собрать и конвертировать домены для ZeroOmega
        run: |
          python3 -c '
          import os
          import re

          DATA_DIR = "v2fly-data/data"
          visited = set()
          rules = set()

          def parse_list(name):
              if name in visited:
                  return
              visited.add(name)
              filepath = os.path.join(DATA_DIR, name)
              if not os.path.exists(filepath):
                  return
              with open(filepath, "r", encoding="utf-8") as f:
                  for raw_line in f:
                      line = raw_line.split("#")[0].strip()
                      if not line:
                          continue
                      line = re.sub(r"\s+@\S+", "", line).strip()
                      
                      if line.startswith("include:"):
                          inc_name = line.split(":", 1)[1].strip()
                          parse_list(inc_name)
                      elif line.startswith("full:"):
                          domain = line.split(":", 1)[1].strip()
                          rules.add(domain)
                      elif line.startswith("domain:"):
                          domain = line.split(":", 1)[1].strip()
                          rules.add("*." + domain)
                      elif line.startswith("regexp:") or line.startswith("keyword:"):
                          continue
                      else:
                          rules.add("*." + line)

          parse_list("anthropic")

          header = [
              "[SwitchyOmega Conditions]",
              "; Require: SwitchyOmega 2.5.0",
              "; Source: v2fly/domain-list-community (anthropic)",
              ""
          ]

          with open("claude.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(header + sorted(rules)) + "\n")
          '

      - name: Удалить временную папку
        run: rm -rf v2fly-data

      - name: Сохранить обновленный файл в репозиторий
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          git add claude.txt
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update claude.txt"
            git push
          fi
